<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120B18"/><stop offset="1" stop-color="#0B0710"/></linearGradient>
<radialGradient id="gl" cx="85%" cy="15%" r="75%"><stop offset="0" stop-color="#714B67" stop-opacity=".55"/><stop offset="1" stop-color="#714B67" stop-opacity="0"/></radialGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#C48BB5"/><stop offset=".6" stop-color="#714B67"/><stop offset="1" stop-color="#714B67" stop-opacity="0"/></linearGradient></defs>
<style>.s{font-family:Georgia,'Palatino Linotype',serif}.m{font-family:ui-monospace,Menlo,Consolas,monospace}.n{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.f{animation:f .9s cubic-bezier(.16,1,.3,1) both}@keyframes f{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
