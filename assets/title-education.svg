<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 128" width="1200" height="128" role="img">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#150e1d"/><stop offset="1" stop-color="#0b0710"/></linearGradient>
<radialGradient id="gl" cx="82%" cy="22%" r="70%"><stop offset="0" stop-color="#714b67" stop-opacity=".55"/><stop offset="1" stop-color="#714b67" stop-opacity="0"/></radialGradient>
<radialGradient id="gl2" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#714b67" stop-opacity=".4"/><stop offset="1" stop-color="#714b67" stop-opacity="0"/></radialGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#c48bb5"/><stop offset=".6" stop-color="#714b67"/><stop offset="1" stop-color="#714b67" stop-opacity="0"/></linearGradient>
<linearGradient id="tp" x1="0" x2="1"><stop offset="0" stop-color="#dcb6d1"/><stop offset="1" stop-color="#dcb6d1" stop-opacity="0"/></linearGradient>
<pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c48bb5" stroke-opacity=".06"/></pattern></defs>
<style>.s{font-family:Georgia,'Palatino Linotype',serif}.m{font-family:ui-monospace,Menlo,Consolas,monospace}.n{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.f{animation:f .9s cubic-bezier(.16,1,.3,1) both}@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sp{to{stroke-dashoffset:-800}}@keyframes bl{50%{opacity:0}}@keyframes fl{50%{transform:translateY(-6px)}}.fl{animation:fl 5s ease-in-out infinite}</style>
