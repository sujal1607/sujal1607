<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120B18"/><stop offset="1" stop-color="#0B0710"/></linearGradient>
<radialGradient id="gl" cx="85%" cy="15%" r="75%"><stop offset="0" stop-color="#714B67" stop-opacity=".55"/><stop offset="1" stop-color="#714B67" stop-opacity="0"/></radialGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#C48BB5"/><stop offset=".6" stop-color="#714B67"/><stop offset="1" stop-color="#714B67" stop-opacity="0"/></linearGradient></defs>
<style>.s{font-family:Georgia,'Palatino Linotype',serif}.m{font-family:ui-monospace,Menlo,Consolas,monospace}.n{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.f{animation:f .9s cubic-bezier(.16,1,.3,1) both}@keyframes f{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sp{to{stroke-dashoffset:-600}}@keyframes bl{50%{opacity:0}}</style>
<rect width="1200" height="350" rx="20" fill="url(#bg)"/><rect width="1200" height="350" rx="20" fill="url(#gl)"/>
<rect x=".5" y=".5" width="1199" height="349" rx="20" fill="none" stroke="#714B67" stroke-opacity=".5"/><text class="n f" x="50" y="60" font-size="17" fill="#F6EEF4" font-weight="400" style="animation-delay:0.3s" >Results-driven web and Odoo developer from Ahmedabad,</text><text class="n f" x="50" y="88" font-size="17" fill="#F6EEF4" font-weight="400" style="animation-delay:0.42s" >proficient in full-stack development and Odoo customization. I</text><text class="n f" x="50" y="116" font-size="17" fill="#F6EEF4" font-weight="400" style="animation-delay:0.54s" >deliver custom Odoo modules and customizations for live</text><text class="n f" x="50" y="144" font-size="17" fill="#F6EEF4" font-weight="400" style="animation-delay:0.66s" >clients across v14 to v19, and now build apps on Odoo v20 at</text><text class="n f" x="50" y="172" font-size="17" fill="#F6EEF4" font-weight="400" style="animation-delay:0.78s" >Admionix Solutions.</text><text class="n f" x="50" y="218" font-size="17" fill="#A99AA6" font-weight="400" style="animation-delay:0.9s" >Alongside ERP work I build React.js web projects and a POS</text><text class="n f" x="50" y="246" font-size="17" fill="#A99AA6" font-weight="400" style="animation-delay:1.02s" >mobile application, and use AI tools like Claude, ChatGPT,</text><text class="n f" x="50" y="274" font-size="17" fill="#A99AA6" font-weight="400" style="animation-delay:1.1400000000000001s" >OpenCode and Grok in my daily workflow.</text><rect x="800" y="40" width="350" height="84" rx="14" fill="#714B67" fill-opacity=".22" stroke="#C48BB5" stroke-opacity=".4"/><text class="s f" x="822" y="92" font-size="40" fill="#F6EEF4" font-weight="700" style="animation-delay:0.3s" >20+</text><text class="n f" x="960" y="90" font-size="15" fill="#A99AA6" font-weight="400" style="animation-delay:0.4s" >custom Odoo modules</text><rect x="800" y="140" width="350" height="84" rx="14" fill="#714B67" fill-opacity=".22" stroke="#C48BB5" stroke-opacity=".4"/><text class="s f" x="822" y="192" font-size="40" fill="#F6EEF4" font-weight="700" style="animation-delay:0.5s" >v14–v20</text><text class="n f" x="990" y="190" font-size="15" fill="#A99AA6" font-weight="400" style="animation-delay:0.6000000000000001s" >Odoo versions worked on</text><rect x="800" y="240" width="350" height="84" rx="14" fill="#714B67" fill-opacity=".22" stroke="#C48BB5" stroke-opacity=".4"/><text class="s f" x="822" y="292" font-size="40" fill="#F6EEF4" font-weight="700" style="animation-delay:0.7s" >2 yrs</text><text class="n f" x="960" y="290" font-size="15" fill="#A99AA6" font-weight="400" style="animation-delay:0.8s" >managing a university website</text></svg>